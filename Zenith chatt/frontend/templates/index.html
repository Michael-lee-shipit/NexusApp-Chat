<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexusApp</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app-container" class="app-wrapper">
      <header class="app-topbar">
        <div class="sidebar-menu">
          <button
            id="sidebar-menu-btn"
            class="sidebar-menu-toggle"
            type="button"
            title="Open menu"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="sidebar-actions"
          >
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
          </button>
          <div class="sidebar-actions" id="sidebar-actions">
            <div class="drawer-profile">
              <div class="drawer-profile-identity">
                <img id="drawer-avatar" src="" alt="" />
                <div class="drawer-profile-copy">
                  <strong id="drawer-display-name"></strong>
                  <span id="drawer-username"></span>
                </div>
              </div>
              <div class="drawer-status-control" id="drawer-status-control">
                <button
                  class="drawer-status-toggle"
                  id="drawer-status-toggle"
                  type="button"
                  aria-label="Toggle account options"
                  aria-expanded="false"
                  aria-controls="drawer-status-menu"
                >
                  <i
                    class="fa-solid fa-chevron-down status-chevron"
                    aria-hidden="true"
                  ></i>
                </button>
                <div
                  class="drawer-status-menu"
                  id="drawer-status-menu"
                  aria-hidden="true"
                >
                  <button
                    id="add-account-btn"
                    class="drawer-add-account"
                    type="button"
                  >
                    <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
                    <span>Add Account</span>
                  </button>
                </div>
              </div>
            </div>
            <button id="my-profile-btn" type="button">
              <i class="fa-solid fa-user" aria-hidden="true"></i>
              <span>My Profile</span>
            </button>
            <button id="new-group-btn" type="button">
              <i class="fa-solid fa-users" aria-hidden="true"></i>
              <span>New Group</span>
            </button>
            <button id="new-channel-btn" type="button">
              <i class="fa-solid fa-bullhorn" aria-hidden="true"></i>
              <span>New channel</span>
            </button>
            <button id="contacts-btn" type="button">
              <i class="fa-solid fa-address-book" aria-hidden="true"></i>
              <span>Contact</span>
            </button>
            <button id="call-btn" type="button">
              <i class="fa-solid fa-phone" aria-hidden="true"></i>
              <span>Call</span>
            </button>
            <button id="settings-link-btn" type="button" title="Settings">
              <i class="fa-solid fa-gear" aria-hidden="true"></i>
              <span>Settings</span>
            </button>
            <label class="drawer-theme-toggle" for="dark-mode-toggle">
              <span
                ><i class="fa-solid fa-moon" aria-hidden="true"></i>Dark
                Mode</span
              >
              <input
                id="dark-mode-toggle"
                type="checkbox"
                role="switch"
                aria-label="Dark Mode"
              />
            </label>
            <button id="new-room-btn" title="Create Room">
              <i class="fa-solid fa-plus" aria-hidden="true"></i>
              <span>New chat</span>
            </button>
            <button id="logout-btn" title="Log Out">
              <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
              <span>Log out</span>
            </button>
          </div>
        </div>
        <div class="sidebar-brand" aria-label="NexusApp">
          <span>NexusApp</span>
        </div>
        <div class="search-bar">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input
            id="chat-search"
            type="search"
            placeholder="Search chats"
            aria-label="Search chats"
            autocomplete="off"
          />
        </div>
        <div class="topbar-actions">
          <button
            id="topbar-theme-toggle"
            type="button"
            class="topbar-icon-btn topbar-theme-btn"
            title="Switch to light mode"
            aria-label="Switch to light mode"
            aria-pressed="true"
          >
            <i class="fa-solid fa-moon" aria-hidden="true"></i>
          </button>
          <div class="topbar-menu-wrap" id="topbar-menu-wrap">
            <button
              id="topbar-more-btn"
              type="button"
              class="topbar-icon-btn"
              title="More options"
              aria-label="More options"
              aria-expanded="false"
              aria-controls="topbar-more-menu"
            >
              <i class="fa-solid fa-ellipsis-vertical" aria-hidden="true"></i>
            </button>
            <div
              class="topbar-more-menu"
              id="topbar-more-menu"
              role="menu"
              aria-label="More options"
              aria-hidden="true"
            >
              <button
                type="button"
                role="menuitem"
                data-topbar-action="new-chat"
              >
                <i class="fa-regular fa-pen-to-square" aria-hidden="true"></i>
                <span>New chat</span>
              </button>
              <button
                type="button"
                role="menuitem"
                data-topbar-action="linked-devices"
              >
                <i class="fa-solid fa-laptop" aria-hidden="true"></i>
                <span>Linked devices</span>
              </button>
              <button
                type="button"
                role="menuitem"
                data-topbar-action="starred"
              >
                <i class="fa-regular fa-star" aria-hidden="true"></i>
                <span>Starred</span>
              </button>
              <button
                type="button"
                role="menuitem"
                data-topbar-action="read-all"
              >
                <i class="fa-solid fa-check-double" aria-hidden="true"></i>
                <span>Read all</span>
              </button>
              <button
                type="button"
                role="menuitem"
                data-topbar-action="settings"
              >
                <i class="fa-solid fa-gear" aria-hidden="true"></i>
                <span>Settings</span>
              </button>
              <button type="button" role="menuitem" data-topbar-action="logout">
                <i
                  class="fa-solid fa-right-from-bracket"
                  aria-hidden="true"
                ></i>
                <span>Log out</span>
              </button>
            </div>
          </div>
          <button
            type="button"
            class="topbar-icon-btn"
            title="Notifications"
            aria-label="Notifications"
          >
            <i class="fa-regular fa-bell" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="rooms-list-container">
          <h4>Conversations</h4>
          <ul id="rooms-list" aria-label="Conversations"></ul>
        </div>

        <div class="archive-section">
          <button id="toggle-archive-view" class="btn-text">
            <i class="fa-solid fa-box-archive"></i>
            <span id="archive-toggle-text">View Archived Rooms</span>
          </button>
        </div>
      </aside>

      <!-- CHAT MAIN -->
      <main class="chat-main empty-state" id="chat-main">
        <header class="chat-header">
          <button
            id="back-to-chats-btn"
            class="back-to-chats-btn"
            type="button"
            title="Back to chats"
            aria-label="Back to chats"
          >
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
          </button>
          <div class="active-room-info">
            <h3 id="active-room-name">Select a Room</h3>
            <span
              id="active-room-status"
              class="connection-status"
              data-state="disconnected"
              role="status"
            >
              <span class="connection-status-dot" aria-hidden="true"></span>
              <span id="active-room-status-text">Not connected</span>
            </span>
          </div>
          <div
            class="chat-header-actions"
            role="group"
            aria-label="Room actions"
          >
            <button id="archive-room-btn" title="Archive / Unarchive Room">
              <i class="fa-solid fa-box-archive"></i>
            </button>
            <button title="Voice Call">
              <i class="fa-solid fa-phone"></i>
            </button>
            <button title="Video Call">
              <i class="fa-solid fa-video"></i>
            </button>
          </div>
        </header>

        <div id="chat-messages" class="chat-messages-feed"></div>

        <div class="empty-chat-state" id="empty-chat-state" role="status">
          <span>Select a chat to start messaging</span>
        </div>

        <footer class="chat-input-footer">
          <form id="message-form">
            <div class="composer-field" id="composer-field">
              <button
                type="button"
                class="attach-btn"
                title="Attach File"
                aria-label="Attach file"
              >
                <i class="fa-solid fa-paperclip" aria-hidden="true"></i>
              </button>
              <textarea
                id="message-input"
                placeholder="Type a message..."
                rows="1"
                aria-label="Message"
                required
              ></textarea>
              <div
                id="recording-indicator"
                class="recording-indicator"
                role="status"
                aria-live="polite"
                hidden
              >
                <span class="recording-visualizer" aria-hidden="true">
                  <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
                </span>
                <time id="recording-timer">00:00</time>
                <span class="recording-label">Recording voice note</span>
              </div>
              <div id="voice-note-preview" class="voice-clip-preview" hidden>
                <audio
                  id="voice-note-audio"
                  controls
                  aria-label="Recorded voice note"
                ></audio>
                <span class="voice-clip-label">Voice note attached</span>
                <button
                  type="button"
                  id="discard-voice-note"
                  aria-label="Discard voice note"
                  title="Discard recording"
                >
                  <i class="fa-solid fa-trash" aria-hidden="true"></i>
                </button>
              </div>
              <div class="composer-actions">
                <button
                  type="button"
                  class="composer-action-btn"
                  id="emoji-picker-btn"
                  title="Choose emoji"
                  aria-label="Choose emoji"
                  aria-expanded="false"
                  aria-controls="emoji-picker"
                >
                  <i class="fa-regular fa-face-smile" aria-hidden="true"></i>
                </button>
                <button
                  type="button"
                  class="composer-action-btn"
                  id="camera-picker-btn"
                  title="Choose a photo"
                  aria-label="Choose a photo"
                >
                  <i class="fa-solid fa-camera" aria-hidden="true"></i>
                </button>
                <input
                  id="camera-picker-input"
                  type="file"
                  accept="image/*"
                  capture="environment"
                  hidden
                />
                <button
                  type="button"
                  class="composer-action-btn desktop-voice-btn"
                  id="voice-note-btn"
                  title="Record voice note"
                  aria-label="Record voice note"
                  aria-pressed="false"
                >
                  <i class="fa-solid fa-microphone" aria-hidden="true"></i>
                </button>
              </div>
              <div
                class="emoji-picker"
                id="emoji-picker"
                role="dialog"
                aria-label="Choose an emoji"
                hidden
              >
                <label class="emoji-search">
                  <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                  <input
                    id="emoji-search"
                    type="search"
                    placeholder="Search emoji"
                    aria-label="Search emoji"
                    autocomplete="off"
                  />
                  <kbd>ESC</kbd>
                </label>
                <nav
                  class="emoji-picker-categories"
                  id="emoji-picker-categories"
                  aria-label="Emoji categories"
                ></nav>
                <div
                  class="emoji-picker-grid"
                  id="emoji-picker-grid"
                  role="list"
                  aria-label="Emoji results"
                ></div>
                <p class="emoji-picker-empty" id="emoji-picker-empty" hidden>
                  No emoji found. Try another search.
                </p>
              </div>
            </div>
            <button
              type="submit"
              class="send-btn desktop-send-btn"
              title="Send Message"
              aria-label="Send message"
            >
              <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
            </button>
            <button
              type="button"
              class="mobile-action-btn"
              id="mobile-composer-action"
              title="Record voice note"
              aria-label="Record voice note"
            >
              <i class="fa-solid fa-microphone" aria-hidden="true"></i>
            </button>
          </form>
          <p
            id="composer-status"
            class="composer-status"
            role="status"
            aria-live="polite"
          ></p>
        </footer>
      </main>
    </div>

    <script type="module" src="../app.js?v=20261012-offline-emoji"></script>
  </body>
</html>
