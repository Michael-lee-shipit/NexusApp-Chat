<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexusApp</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="brand-header">
          <div class="logo-badge"><i class="fa-solid fa-gear"></i></div>
          <h2>Account Settings</h2>
        </div>

        <div class="form-section">
          <h3>NexusApp Profile</h3>
          <p class="subtitle">Customize your preferences</p>

          <div class="setting-group">
            <label>Username</label>
            <input type="text" id="settings-username" readonly />
          </div>

          <div class="setting-group">
            <label>Avatar Seed (DiceBear)</label>
            <input
              type="text"
              id="settings-avatar-seed"
              placeholder="Enter custom seed..."
            />
          </div>

          <button id="save-settings" class="btn-primary">Save Changes</button>
          <button
            id="back-to-chat"
            class="btn-secondary"
            style="width: 100%; margin-top: 10px"
          >
            Back to Chat
          </button>
        </div>
      </div>
    </div>

    <script src="../app.js"></script>
  </body>
</html>
